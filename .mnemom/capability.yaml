# Capability manifest for the mnemom-adw worker on mnemom/docs (Mintlify docs site).
# LIVE auto-merge (merge_strategy: worker): the worker drives the required CI checks green,
# runs the in-pipeline adversarial review gate (mnemom-adw MNE-249), then squash-merges.
# Deploy/publish stays human-gated downstream. docs is PUBLIC — a merged change is publicly
# visible; the Mintlify validation check + the review gate are the guard.
stack: typescript
package_manager: npm
merge_strategy: worker

# Doc-validation verbs (npm scripts in this repo). There's no compile/build — the site is
# Mintlify-hosted — so `build`/`typecheck` are no-ops. `test` runs the doc↔OpenAPI example
# validator (catches a bad curl snippet, e.g. MNE-192); `lint` checks redirect integrity.
# Internal-link coverage is NOT part of `lint`: `mint broken-links` is the sole internal-link
# gate (see the "Validate Mintlify Docs" required check below). The old `npm run check:links`
# half named a script deleted in #384 along with scripts/check-links-local.mjs.
commands:
  lint: npm run check:redirects
  typecheck: echo "(no typecheck for MDX docs)"
  test: npm ci && npm run check:doc-examples
  build: echo "(Mintlify-hosted build; validated by CI)"

# Only image changes count as visual UX work; prose/.mdx edits don't trigger the
# visual-validation phase. ADW_UX_GATE is also advisory in adw-zte.yml as belt-and-suspenders.
ux_path_globs:
  - "images/**"

# The worker drives the deterministic Mintlify doc check (mint broken-links) green before
# handing off; the user reviews the remaining checks on the supervised PR before merging.
required_checks:
  - "Validate Mintlify Docs"

targets: []
