name: Code facts

# Keeps scripts/code-facts-snapshot.json honest against the code it vendors
# (MNE-9916). mnemom-api and mnemom-platform each generate a code-facts.json
# from their own constants and fail their own CI while it is stale:
#
#   mnemom/mnemom-api       code-facts.json
#   mnemom/mnemom-platform  gateway/code-facts.json
#
# Both repos are private, so docs vendors the merged facts. The offline half
# (annotated pages vs the snapshot) runs on every PR in docs-validators.yml.
# This job is the other half: it re-reads both files from main and fails if a
# fact was added, removed, or changed its value, source, or symbol.
#
# Reading private repos needs a token. Like pricing-ratecard.yml, this reuses
# the org's existing ADW GitHub App (vars.ADW_APP_ID +
# secrets.ADW_APP_PRIVATE_KEY), minted read-only and scoped to the two source
# repos. No new secret. It does not run on pull_request: a docs PR that vendors
# facts from a source PR that has not merged yet is expected, and the offline
# check already covers the PR. A red run here means: re-run
# `node scripts/sync-code-facts.mjs`, then `npm run check:code-facts`, fix any
# page it flags, and open a PR.

#
# The same job also keeps scripts/api-linked-pages.json honest (MNE-10095):
# the docs pages mnemom-api links from the Org Scan report. It re-reads the api
# source files that hold those links and fails if the api links a page the
# list does not hold. A red run there means: re-run
# `node scripts/sync-api-linked-pages.mjs`, then `npm run check:api-linked-pages`,
# and open a PR.

on:
  push:
    branches: ["main"]
  schedule:
    - cron: "17 8 * * *" # daily 08:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot-vs-source:
    name: Code facts snapshot matches mnemom-api and mnemom-platform main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22.x"
      - name: Mint a read-only token for mnemom-api and mnemom-platform
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.ADW_APP_ID }}
          private-key: ${{ secrets.ADW_APP_PRIVATE_KEY }}
          owner: mnemom
          repositories: mnemom-api,mnemom-platform
          permission-contents: read
      - name: Compare the snapshot with code-facts.json on both repos' main
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: node scripts/sync-code-facts.mjs --check
      - name: Compare the api-linked pages list with mnemom-api main
        if: ${{ !cancelled() && steps.app.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: node scripts/sync-api-linked-pages.mjs --check
