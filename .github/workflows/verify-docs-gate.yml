name: Verify docs gate (Engine A)

# Per-PR docs↔code conformance gate for mnemom/docs.
#
# The gate logic lives in the private mnemom/mnemom-test repo at
# `docs/verify-full.sh` — a deterministic conformance runner over the built
# layers (api-coverage, api-examples, cli, sdk, links). It emits a canonical
# SurfaceReport on stdout and exits 0 (pass) / 1 (fail) / 2 (infra).
#
# This workflow is the docs-side wrapper that mnemom-test's own verify-docs.yml
# defers to ("Per-PR gating on the docs repo itself is wired from a thin wrapper
# in mnemom/docs that runs verify-full.sh against the PR checkout"). It checks
# out mnemom-test (the runner) + this PR's docs (the oracle under test), points
# DOCS_DIR at the PR checkout, and runs the layers against it.
#
# ── Blocking vs advisory (PROD-LAG AWARENESS) ─────────────────────────────────
# The `api-coverage` and `api-examples` layers validate documented endpoints /
# request bodies against the LIVE prod OpenAPI spec. That spec lags deploys, so
# these layers can transiently FAIL on endpoints that already exist in code +
# docs but haven't gone live yet. Gating a docs PR on those would red-flag PRs
# for a reason that has nothing to do with the PR — purely deploy timing.
#
# Therefore the INITIAL split is:
#   BLOCKING  → cli, sdk, links   (no live-prod dependency; oracles are the
#                                  CLI command-tree snapshot, the mnemom-platform
#                                  SDK source, and the docs tree itself)
#   ADVISORY  → api-coverage, api-examples  (live-prod-dependent; run with
#                                  continue-on-error, surfaced in the Summary,
#                                  NOT failing the PR)
#
# A sibling fix (mnemom-test branch fix/api-coverage-prod-lag) is moving
# api-coverage to validate against the COMMITTED spec instead of live prod.
# ONCE THAT MERGES: move `api-coverage` from the advisory step into the blocking
# `--layers=` set below (and, if api-examples gets the same treatment, it too).
# Until then, keep them advisory.
#
# Oracle env (verify-full.sh reads these; CI sets them from repo checkouts):
#   DOCS_DIR             → this PR's docs checkout (the pages under test)
#   MNEMOM_PLATFORM_DIR  → mnemom-platform checkout (SDK source oracle for the
#                          sdk layer; the cli layer falls back to its committed
#                          command-tree.json snapshot if the built binary is
#                          absent, so it does not strictly need this)
#   MNEMOM_OPENAPI_URL   → left unset; derived from --env (prod → api.mnemom.ai)
#
# Secrets required (cross-repo reads of PRIVATE repos; mirror the
# `DOCS_READ_TOKEN` convention mnemom-test uses to read this repo):
#   MNEMOM_TEST_READ_TOKEN      → read access to mnemom/mnemom-test (the runner)
#   MNEMOM_PLATFORM_READ_TOKEN  → read access to mnemom/mnemom-platform (sdk oracle)
# Both fall back to github.token, which will NOT have cross-repo private access
# in practice — so the tokens must be configured as repo/org secrets for the
# gate to run. If MNEMOM_PLATFORM_READ_TOKEN is missing, the sdk layer cannot
# read its oracle and would report infra (exit 2); see the platform-checkout
# step's note.

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-docs-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-docs-gate:
    name: docs↔code conformance (Engine A)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout docs (the PR — pages under test)
        uses: actions/checkout@v4
        with:
          path: docs

      - name: "Checkout mnemom-test (the runner: verify-full.sh + layers)"
        uses: actions/checkout@v4
        with:
          repository: mnemom/mnemom-test
          ref: main
          path: mnemom-test
          token: ${{ secrets.MNEMOM_TEST_READ_TOKEN || github.token }}

      - name: "Checkout mnemom-platform (oracle: SDK source for the sdk layer)"
        uses: actions/checkout@v4
        with:
          repository: mnemom/mnemom-platform
          ref: main
          path: mnemom-platform
          token: ${{ secrets.MNEMOM_PLATFORM_READ_TOKEN || github.token }}

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # ── BLOCKING ────────────────────────────────────────────────────────────
      # No live-prod dependency → safe to fail the PR on. verify-full.sh exits
      # 0 pass / 1 fail / 2 infra; we capture the report + the code and propagate
      # it at the end so the Summary still renders on failure.
      - name: Run BLOCKING layers (cli, sdk, links)
        id: blocking
        working-directory: mnemom-test
        env:
          DOCS_DIR: ${{ github.workspace }}/docs
          MNEMOM_PLATFORM_DIR: ${{ github.workspace }}/mnemom-platform
          # MNEMOM_OPENAPI_URL unset → not consulted by these layers anyway.
        run: |
          set +e
          ./docs/verify-full.sh --env=prod --layers=cli,sdk,links \
            > "${GITHUB_WORKSPACE}/report-blocking.json" 2> stream-blocking.txt
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          cat stream-blocking.txt

      # ── ADVISORY ──────────────────────────────────────────────────────────────
      # Live-prod-dependent (validate against the live OpenAPI spec, which lags
      # deploys). continue-on-error → surfaced but NEVER fails the PR. Move
      # api-coverage into the blocking set above once fix/api-coverage-prod-lag
      # lands in mnemom-test.
      - name: Run ADVISORY layers (api-coverage, api-examples) — non-blocking
        id: advisory
        continue-on-error: true
        working-directory: mnemom-test
        env:
          DOCS_DIR: ${{ github.workspace }}/docs
          MNEMOM_PLATFORM_DIR: ${{ github.workspace }}/mnemom-platform
        run: |
          set +e
          ./docs/verify-full.sh --env=prod --layers=api-coverage,api-examples \
            > "${GITHUB_WORKSPACE}/report-advisory.json" 2> stream-advisory.txt
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          cat stream-advisory.txt

      - name: Render summary
        if: always()
        run: |
          render() {
            local title="$1" file="$2"
            echo "### ${title}"
            echo ""
            if [ ! -s "$file" ]; then
              echo "_(no report emitted — see step logs)_"
              echo ""
              return
            fi
            echo "| axis | total | pass | warn | fail | err |"
            echo "|------|------:|-----:|-----:|-----:|----:|"
            jq -r '.axes[] | "| \(.axis) | \(.total) | \(.passed) | \(.warned) | \(.failed) | \(.errors) |"' "$file" 2>/dev/null || echo "| (unparseable report) | | | | | |"
            echo ""
            jq -r '.axes[].details[]? | select(.severity=="fail" or .severity=="error") | "- ❌ \(.description) — \(.message)"' "$file" 2>/dev/null
            jq -r '.axes[].details[]? | select(.severity=="warn") | "- ⚠️ \(.description) — \(.message)"' "$file" 2>/dev/null
            echo ""
          }
          {
            echo "## docs surface — Engine A (env: prod)"
            echo ""
            echo "Blocking exit: \`${{ steps.blocking.outputs.exit_code }}\` · Advisory exit: \`${{ steps.advisory.outputs.exit_code }}\` _(advisory does not fail the PR)_"
            echo ""
            render "BLOCKING — cli, sdk, links (fails the PR)" "${GITHUB_WORKSPACE}/report-blocking.json"
            render "ADVISORY — api-coverage, api-examples (informational; live-prod-lag)" "${GITHUB_WORKSPACE}/report-advisory.json"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload SurfaceReports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docs-surface-report-${{ github.run_id }}
          path: |
            report-blocking.json
            report-advisory.json
          if-no-files-found: warn
          retention-days: 30

      # Fail the PR ONLY on the blocking layers. Exit 1 = a documented surface
      # drifted; exit 2 = infra (e.g. missing oracle / token) — both should fail
      # so a misconfigured gate is loud, not silently green.
      - name: Enforce blocking result
        if: always()
        run: |
          CODE="${{ steps.blocking.outputs.exit_code }}"
          echo "Blocking layers exit code: ${CODE}"
          if [ "${CODE}" != "0" ]; then
            echo "::error::Blocking docs conformance layers (cli, sdk, links) failed with exit ${CODE}."
            exit "${CODE}"
          fi
          echo "✓ Blocking docs conformance layers passed."
