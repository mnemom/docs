name: Verify docs gate (Engine A)

# Per-PR docs↔code conformance gate for mnemom/docs.
#
# The gate logic lives in the private mnemom/mnemom-test repo at
# `docs/verify-full.sh` — a deterministic conformance runner over the built
# layers (api-coverage, api-examples, cli, sdk, links). It emits a canonical
# SurfaceReport on stdout and exits 0 (pass) / 1 (fail) / 2 (infra).
#
# This workflow is the docs-side wrapper that mnemom-test's own verify-docs.yml
# defers to. It checks out mnemom-test (the runner) + this PR's docs (the oracle
# under test), points DOCS_DIR at the PR checkout, and runs the layers.
#
# ── Posture: per-layer, driven by the committed threshold manifest (MNE-1064) ──
# The harness's per-layer enforcement policy lives in the committed
# `.github/docs-gate-thresholds.json` manifest, read by
# `.github/scripts/enforce-docs-gate.sh` after every run. A layer marked
# "blocking" there fails the PR the moment its SurfaceReport (failed + errors)
# exceeds its committed budget (normally 0 — any new drift red-walls); a layer
# marked "advisory" is only ever surfaced in the Summary, never fails the PR.
#
# As of the 2026-07-21 flip only `sdk` is genuinely clean and blocking — a live
# run found `cli` and `links` still carry real, tracked false-positives (stale/
# incomplete CLI oracle snapshot; a link-walker false-positive on its own
# anchor-fragment-validator doc) despite MNE-1394's earlier burndown, so they
# stay advisory pending a further gate-infra fix — see the manifest's per-layer
# `reason` fields for specifics and what unblocks each one's flip.
# `api-examples` wraps the live-prod walker and stays advisory (out of scope —
# MNE-1064 only covers the no-live-prod-dependency layers cli/sdk/links).
# `api-coverage` / `api-reference-orphans` are untouched by this ticket.
#
# ── Activation: org-owned mnemom-docs GitHub App ──────────────────────────────
# Reading the PRIVATE mnemom-test / mnemom-platform / mnemom-api repos uses the
# org-owned `mnemom-docs` GitHub App (Contents: Read-only, installed on those
# repos) to mint a short-lived, repo-scoped token per run via
# actions/create-github-app-token — no long-lived PAT stored in this public repo.
# UNTIL the App key is configured, this workflow SKIPS cleanly (posts an
# "inactive" notice, exits 0) — it never blocks a PR or shows a confusing red.
# Configure to activate:
#   vars.APP_ID            → the mnemom-docs App id
#   secrets.APP_PRIVATE_KEY → the mnemom-docs App private key (PEM)

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-docs-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-docs-gate:
    name: docs↔code conformance (Engine A)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Activation flag — true only when the cross-repo read token is configured.
    # Every functional step gates on this so a missing secret SKIPS (not fails).
    # Activation flag — true only when the mnemom-docs GitHub App private key is
    # configured. A missing key SKIPS cleanly (never fails/blocks a PR).
    env:
      GATE_ACTIVE: ${{ secrets.APP_PRIVATE_KEY != '' }}

    steps:
      - name: Gate inactive notice (App credentials not configured)
        if: env.GATE_ACTIVE != 'true'
        run: |
          {
            echo "## docs surface — Engine A gate: INACTIVE"
            echo ""
            echo "Skipped: the \`mnemom-docs\` GitHub App key (\`APP_PRIVATE_KEY\`) is not"
            echo "configured, so the private oracle repos cannot be checked out. This is a"
            echo "clean skip — the gate never blocks a PR until activated. See the header."
          } >> "$GITHUB_STEP_SUMMARY"

      # Short-lived, read-only, repo-scoped token from the org-owned mnemom-docs
      # GitHub App (replaces long-lived per-repo PATs).
      - name: Mint cross-repo read token (GitHub App)
        if: env.GATE_ACTIVE == 'true'
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: mnemom
          repositories: mnemom-test,mnemom-platform,mnemom-api

      - name: Checkout docs (the PR — pages under test)
        if: env.GATE_ACTIVE == 'true'
        uses: actions/checkout@v5
        with:
          path: docs

      - name: "Checkout mnemom-test (the runner: verify-full.sh + layers)"
        if: env.GATE_ACTIVE == 'true'
        uses: actions/checkout@v5
        with:
          repository: mnemom/mnemom-test
          ref: main
          path: mnemom-test
          token: ${{ steps.app-token.outputs.token }}

      - name: "Checkout mnemom-platform (oracle: SDK source for the sdk layer)"
        if: env.GATE_ACTIVE == 'true'
        uses: actions/checkout@v5
        with:
          repository: mnemom/mnemom-platform
          ref: main
          path: mnemom-platform
          token: ${{ steps.app-token.outputs.token }}

      - name: "Checkout mnemom-api (oracle: committed spec for api-coverage)"
        if: env.GATE_ACTIVE == 'true'
        uses: actions/checkout@v5
        with:
          repository: mnemom/mnemom-api
          ref: main
          path: mnemom-api
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up Node 20
        if: env.GATE_ACTIVE == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: "22.x"

      # Full run is always continue-on-error at THIS step — enforcement is a
      # separate, later step so we always get one full report + summary
      # regardless of which layers are blocking. See docs-gate-thresholds.json
      # for which layers actually fail the PR.
      - name: Run docs conformance layers
        if: env.GATE_ACTIVE == 'true'
        id: run
        continue-on-error: true
        working-directory: mnemom-test
        env:
          DOCS_DIR: ${{ github.workspace }}/docs
          MNEMOM_PLATFORM_DIR: ${{ github.workspace }}/mnemom-platform
          MNEMOM_API_DIR: ${{ github.workspace }}/mnemom-api
          # MNEMOM_OPENAPI_URL unset → derived from --env (prod → api.mnemom.ai)
        run: |
          set +e
          ./docs/verify-full.sh --env=prod > "${GITHUB_WORKSPACE}/report.json" 2> stream.txt
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          cat stream.txt

      - name: Render summary
        if: env.GATE_ACTIVE == 'true'
        run: |
          {
            echo "## docs surface — Engine A (env: prod)"
            echo ""
            echo "Runner exit: \`${{ steps.run.outputs.exit_code }}\`. Per-layer enforcement below is driven by \`.github/docs-gate-thresholds.json\` — a layer marked \`blocking\` there fails this PR on any budget breach; \`advisory\` layers are informational only."
            echo ""
            if [ -s "${GITHUB_WORKSPACE}/report.json" ]; then
              echo "| axis | mode | total | pass | warn | fail | err |"
              echo "|------|------|------:|-----:|-----:|-----:|----:|"
              jq -r --slurpfile th "${GITHUB_WORKSPACE}/docs/.github/docs-gate-thresholds.json" '
                . as $r | $th[0].layers as $layers
                | $r.axes[]
                | "| \(.axis) | \($layers[.axis].mode // "advisory") | \(.total) | \(.passed) | \(.warned) | \(.failed) | \(.errors) |"
              ' "${GITHUB_WORKSPACE}/report.json" 2>/dev/null || echo "| (unparseable report) | | | | | | |"
              echo ""
              echo "### Failures"
              jq -r '.axes[].details[]? | select(.severity=="fail" or .severity=="error") | "- ❌ \(.description) — \(.message)"' "${GITHUB_WORKSPACE}/report.json" 2>/dev/null
            else
              echo "_(no report emitted — see step logs)_"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload SurfaceReport
        if: env.GATE_ACTIVE == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: docs-surface-report-${{ github.run_id }}
          path: report.json
          if-no-files-found: warn
          retention-days: 30

      # Per-layer enforcement (MNE-1064) — fails the job (and so the PR check)
      # iff a layer marked "blocking" in docs-gate-thresholds.json breached its
      # budget in this run's report.json. Advisory layers never trip this.
      - name: Enforce per-layer thresholds
        if: env.GATE_ACTIVE == 'true'
        run: |
          ./docs/.github/scripts/enforce-docs-gate.sh \
            "${GITHUB_WORKSPACE}/report.json" \
            "${GITHUB_WORKSPACE}/docs/.github/docs-gate-thresholds.json"

  docs-gate-enforcement-selftest:
    name: enforce-docs-gate.sh self-test (fixtures)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # No GATE_ACTIVE / App key needed — pure fixture-driven unit test of the
    # enforcement script + the committed thresholds manifest. Runs on every
    # PR, including ones with no App key configured, so the enforcement logic
    # itself is always under CI (MNE-1064 "Verified" acceptance criteria).
    steps:
      - name: Checkout docs
        uses: actions/checkout@v5

      - name: Run enforce-docs-gate.sh fixture suite
        run: ./.github/scripts/test-enforce-docs-gate.sh
