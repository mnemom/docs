name: Doc Examples vs OpenAPI

# T5-1 (Safe House Hardening) — doc-as-spec static walker.
#
# Asserts every `curl https://api.mnemom.ai/v1/...` invocation in customer-
# facing MDX corresponds to a real {path, method} in the live OpenAPI spec
# at https://api.mnemom.ai/openapi.json (ADR-054). Catches structural drift
# between docs and the runtime; the spec itself is enforced by mnemom-api's
# four-layer T4 defense, and there is no longer a local copy of the spec
# in this repo to drift against.
#
# Triggers:
#   - pull_request to main (any docs change can introduce drift)
#   - schedule daily (catches drift introduced when mnemom-api ships a new
#     spec without a corresponding doc update — the walker now fetches the
#     live URL on each run, so detection is immediate after deploy)
#   - workflow_dispatch (manual)
#
# Known-drift allowlist lives inside scripts/check-doc-examples.mjs. Each
# entry is tagged with the T5 sub-track that will close it (T5-2 concept
# audit, T5-4 guide audit). The allowlist shrinks as those sub-tracks land.

on:
  pull_request:
    branches: ["main"]
    paths:
      - "**/*.mdx"
      - "**/*.md"
      - "scripts/check-doc-examples.mjs"
      - "scripts/_load-spec.mjs"
      - "scripts/lib/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/doc-examples.yml"
  schedule:
    - cron: "45 6 * * *" # daily
  workflow_dispatch:

jobs:
  check-examples:
    name: Walk MDX curl examples vs openapi.json
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout docs
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install deps (ajv + ajv-formats for body validation)
        run: npm ci

      - name: Walk doc examples
        run: node scripts/check-doc-examples.mjs
