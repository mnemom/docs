name: Mintlify Docs CI

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  # Daily run guards against rot when referenced pages in other repos
  # move/delete without a corresponding docs PR being opened here.
  # Failure surfaces in the Actions tab even on days with no PR traffic.
  schedule:
    - cron: "0 6 * * *"

jobs:
  validate-docs:
    name: Validate Mintlify Docs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.x"

      - name: Install Mintlify CLI
        run: npm i -g mint

      # Work around an upstream @mintlify/link-rot bug (MNE-2314). Its static
      # broken-link checker calls the THROWING cleanHeadingId() a second time on
      # headings that contain a bare '%' (e.g. "### Integrity ratio (40%)"),
      # crashing the whole `mint broken-links` run with "URIError: URI malformed"
      # before --check-anchors is ever consulted. The render pipeline already
      # uses the catching safeCleanHeadingId() (both are exported from
      # @mintlify/common), so we swap link-rot's static checker to that same safe
      # variant. This is behaviour-preserving (safeCleanHeadingId == cleanHeadingId
      # for every non-malformed id) and touches ZERO doc content — the bare-'%'
      # score-weighting headings stay as authored. Remove once upstream ships a
      # fix; tracked in MNE-2314 (upstream bug report pending).
      - name: Patch link-rot heading-id crash (upstream bug, MNE-2314)
        run: |
          root="$(npm root -g)"
          for rel in graph.js static-checking/getBrokenInternalLinks.js; do
            f="$(find "$root" -path "*@mintlify/link-rot/dist/$rel" | head -1)"
            if [ -z "$f" ]; then
              echo "::error::link-rot $rel not found under $root — layout changed, patch must be revisited (MNE-2314)"
              exit 1
            fi
            perl -pi -e 's/\bcleanHeadingId\b/safeCleanHeadingId/g' "$f"
            echo "patched $f"
          done

      - name: Validate documentation build
        run: mint validate || echo "::warning::mint validate reported issues (non-blocking)"

      - name: Check for broken internal links
        run: mint broken-links

      # Validates the docs.json `redirects` table (which mint broken-links
      # does not inspect): internal redirect destinations must resolve to
      # navigable pages, and the root `/` → `/introduction` redirect must
      # exist. Uses only Node built-ins, so no `npm ci` is required.
      - name: Validate redirects
        run: npm run check:redirects

      # Validates the inverse of check-redirects' locale parity: every page
      # slug in the DEFAULT (en) navigation must have a backing content file
      # on disk, so a nav entry pointing at a missing/deleted page (which
      # Mintlify renders as a dead nav item) fails the build. Node built-ins
      # only, so no `npm ci` is required.
      - name: Validate navigation page existence
        run: npm run check:nav-pages

      # Inverse of check-nav-pages (file→nav): every customer-facing page on
      # disk must be reachable from docs.json navigation, so a new page nobody
      # wires in is not silently un-indexed (docs.json seo.indexing='navigable').
      # Structural exclusions + an allowlist keep it green; Node built-ins only.
      - name: Validate navigation coverage
        run: npm run check:nav-coverage

      # --- Advisory reporting gates (always run; never fail the build) ---
      # Each surfaces docs-health signal on every run without blocking, and can
      # be promoted to blocking later via its own --strict flag (tracked apart).

      # Per-top-level-dir broken-link % table → the job summary. Offline (local
      # link resolution only); complements, does not duplicate, mint broken-links.
      - name: Link-health report (advisory)
        if: ${{ always() }}
        continue-on-error: true
        run: npm run link-health-report

      # Flags MDX references to API paths that are deprecated (WARN) or absent
      # from the committed spec (unknown). Advisory by default; --strict blocks.
      - name: API path-reference drift (advisory)
        if: ${{ always() }}
        continue-on-error: true
        run: npm run check:path-references

      # Flags deprecated:true spec ops lacking a changelog mention / replacement
      # hint. Advisory by default; --strict blocks.
      - name: Deprecation coverage (advisory)
        if: ${{ always() }}
        continue-on-error: true
        run: npm run check:deprecation-coverage
