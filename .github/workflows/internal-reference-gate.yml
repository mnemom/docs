# Regression gate for the docs internal-reference scrub (mnemom/docs#157, MNE-57).
# Fails the build if a customer-facing surface reintroduces an internal reference:
# a private-repo link (404s for customers), a retired codename, an internal agent
# name, a 1Password path, internal tooling paths, or an internal tracker ref.
#
# Scans BOTH surfaces a customer actually sees (MNE-139):
#   1. *.mdx — hand-written pages.
#   2. api-reference/openapi.json — the committed customer slice's PROSE
#      (summary/description/tag text). The generated api-reference pages render
#      their description from the spec, not from .mdx, so a .mdx-only scan was
#      blind to description-level leaks.
#
# All rules + the (shrinking) grandfathered allowlist live in one place:
#   scripts/check-internal-refs.mjs  (run with --self-test for its assertions)
# ADR-NNN citations are allowed in OpenAPI descriptions (public decision records)
# but still banned in hand-written .mdx prose — see the rule's `mdxOnly` flag.

name: Internal-reference gate

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

jobs:
  internal-reference-gate:
    name: Block internal-reference leakage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22.x"
      - name: Self-test the scanner
        run: node scripts/check-internal-refs.mjs --self-test
      - name: Scan *.mdx + OpenAPI prose for internal references
        run: node scripts/check-internal-refs.mjs
