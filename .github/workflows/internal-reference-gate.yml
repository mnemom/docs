# Regression gate for the docs internal-reference scrub (mnemom/docs#157).
# Fails the build if a customer-facing *.mdx reintroduces an internal
# reference: a private-repo link (404s for customers), a retired codename,
# an internal agent name, a 1Password path, internal tooling paths, or an
# internal tracker ref. #157 brought the tree to zero of these; this keeps
# it that way.
#
# Allowed (intentional, do NOT add to the block patterns):
#   - The `smolt-{8hex}` agent-ID format (e.g. smolt-1a2b3c4d). The
#     `\bsmoltbot\b` rule is the codename only and does not match the ID.
#
# To scope a genuine legacy-surface exception, narrow the offending rule's
# regex or exclude the specific file below — and say why in a comment.

name: Internal-reference gate

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

jobs:
  internal-reference-gate:
    name: Block internal-reference leakage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan customer-facing *.mdx for internal references
        run: |
          set -uo pipefail
          # label::ERE-pattern  (matched case-insensitively against *.mdx)
          rules=(
            'private-repo link (404s for customers)::github\.com/mnemom/(scale|safe-house-hardening|safe-house-aegis|deploy)'
            'retired codename smoltbot::\bsmoltbot\b'
            'retired codename XFD/CBD/CFD::\b(xfd|cbd|cfd)\b'
            'internal codename polis::(\bpolis\b|polis_yaml)'
            'internal agent name::\b(solon|themis|cassandra|blackbeard|wintermute)\b'
            '1Password path::op://'
            'internal tooling path::(emps\.|packages/core)'
            'internal tracker ref (UC-N / mnemom-platform#N / ADR-NNN)::(UC-[0-9]|mnemom-platform#[0-9]|ADR-[0-9]{3})'
          )
          fail=0
          for entry in "${rules[@]}"; do
            label="${entry%%::*}"
            pattern="${entry#*::}"
            matches=$(grep -rInE -i \
              --include='*.mdx' \
              --exclude-dir=node_modules --exclude-dir=.git \
              -e "$pattern" . 2>/dev/null || true)
            if [ -n "$matches" ]; then
              echo "::error::Internal reference leak — ${label}"
              echo "$matches"
              echo ""
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "FAIL: customer-facing docs must not contain internal references."
            echo "They leak internal architecture/codenames or 404 for customers."
            echo "If a reference is an intentional legacy surface, scope an exception"
            echo "in .github/workflows/internal-reference-gate.yml (see the rules array)."
            exit 1
          fi
          echo "✓ No internal references in customer-facing *.mdx."
