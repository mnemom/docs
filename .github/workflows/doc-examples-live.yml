name: Doc Examples Live (test cell)

# T5-1.3 (Safe House Hardening): live executor for the doc-as-spec
# walker. Runs every safe-to-execute curl example from customer-facing
# MDX against the Azure test cell (api-az-test.mnemom.ai) and asserts the
# response status is documented in the spec (or a 2xx). Catches runtime
# drift the static walker can't see (endpoints the spec documents but the
# test cell hasn't deployed yet, subtle parameter validation differences).
# Retargeted from api-staging to the test cell by MNE-8861
# (https://linear.app/mnemom-dev/issue/MNE-8861).
#
# Triggers:
#   - schedule nightly (1 hour after the static walker, the test cell
#     should be quiet by then)
#   - workflow_dispatch (manual, useful for one-off verification after
#     adding fixtures or expanding the WRITE_ALLOWLIST)
#
# This workflow is NOT PR-blocking. It can only run with
# MNEMOM_TEST_TOKEN configured (a test-cell organization API key minted
# for this job only, never a us-1 or us-2 key). Without the secret it
# skips with a notice. The base URL comes from repo variable
# MNEMOM_TEST_BASE_URL. Failures here surface as Actions tab warnings,
# not failed-PR red checks.

on:
  schedule:
    - cron: "0 7 * * *" # 1h after doc-examples.yml (06:45)
  workflow_dispatch:

jobs:
  execute-examples:
    name: Run safe doc curl examples against the test cell
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout docs
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.x"
          cache: "npm"

      - name: Install deps
        run: npm ci

      - name: Preflight, test cell token configured?
        id: preflight
        run: |
          if [ -z "${{ secrets.MNEMOM_TEST_TOKEN }}" ]
          then
            echo "::notice::MNEMOM_TEST_TOKEN secret is not set. Live execution skipped."
            echo "Set a test-cell organization API key as repo secret MNEMOM_TEST_TOKEN to enable T5-1.3 live runs."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Execute safe doc examples
        if: steps.preflight.outputs.skip == 'false'
        env:
          MNEMOM_TEST_TOKEN: ${{ secrets.MNEMOM_TEST_TOKEN }}
          MNEMOM_TEST_BASE_URL: ${{ vars.MNEMOM_TEST_BASE_URL || 'https://api-az-test.mnemom.ai/v1' }}
        run: node scripts/run-doc-examples.mjs --verbose
